<svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Every delegation request from the Gemini planner first passes through a Gemma content-triage classifier, then the blast-radius scope firewall, before it reaches a worker agent: approved requests route to an isolated Cloud Run worker, flagged or over-scoped requests are quarantined, and every decision from either layer is HMAC-signed into the provenance chain.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f9d58"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d93025"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="820" fill="#ffffff"/>

  <!-- Dashboard -->
  <rect x="380" y="28" width="240" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937">Web Dashboard</text>
  <text x="500" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">topology · attack studio · audit log</text>

  <line x1="500" y1="84" x2="500" y2="136" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="112" font-family="sans-serif" font-size="11" fill="#374151">HTTP POST / SSE</text>

  <!-- Orchestrator -->
  <rect x="320" y="138" width="360" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="500" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937">Orchestrator Control Plane (Cloud Run)</text>
  <text x="500" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">Gemini 3.5 planner decomposes goal into subtasks</text>
  <text x="500" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">sa: orchestrator-sa</text>

  <line x1="500" y1="210" x2="500" y2="246" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="232" font-family="sans-serif" font-size="11" fill="#374151">delegation request { agent, scope, input }</text>

  <!-- Gemma Triage -->
  <rect x="330" y="248" width="340" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="500" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937">Gemma Triage (pre-firewall)</text>
  <text x="500" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">classifies raw input for prompt-injection intent</text>
  <text x="500" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">independent of scope · runs before any agent is chosen</text>

  <!-- Gemma: flagged -> quarantine -->
  <path d="M330,280 C 190,286 130,300 115,328" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="130" y="272" font-family="sans-serif" font-size="11" font-weight="600" fill="#d93025">flagged</text>

  <!-- Gemma: passed -> firewall -->
  <line x1="500" y1="312" x2="500" y2="344" stroke="#0f9d58" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="512" y="332" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f9d58">passed</text>

  <!-- Quarantine -->
  <rect x="30" y="330" width="170" height="64" rx="8" fill="#fee2e2" stroke="#d93025" stroke-width="1.5"/>
  <text x="115" y="356" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937">Quarantine</text>
  <text x="115" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">chain halted, 0 side effects</text>

  <!-- Firewall -->
  <rect x="330" y="346" width="340" height="78" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="500" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937">Blast-Radius Firewall</text>
  <text x="500" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">child = requested ∩ caller_scope ∩ agent_ceiling</text>
  <text x="500" y="402" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">risk = Σ(action_weight), widening ⇒ reject</text>

  <!-- Firewall: blocked -> quarantine -->
  <path d="M330,395 C 260,392 220,385 200,378" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="205" y="410" font-family="sans-serif" font-size="11" font-weight="600" fill="#d93025">scope violation</text>

  <!-- Firewall: approved -> fleet bus -->
  <line x1="500" y1="424" x2="500" y2="462" stroke="#0f9d58" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="512" y="450" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f9d58">approved (⊆ scope)</text>

  <!-- bus line to fleet -->
  <line x1="355" y1="462" x2="865" y2="462" stroke="#0f9d58" stroke-width="1.5"/>
  <line x1="355" y1="462" x2="355" y2="498" stroke="#0f9d58" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="525" y1="462" x2="525" y2="498" stroke="#0f9d58" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="695" y1="462" x2="695" y2="498" stroke="#0f9d58" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="865" y1="462" x2="865" y2="498" stroke="#0f9d58" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Fleet boxes -->
  <g font-family="sans-serif">
    <rect x="280" y="498" width="150" height="88" rx="8" fill="#f0fdf4" stroke="#0f9d58" stroke-width="1.5"/>
    <text x="355" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">DbQueryAgent</text>
    <text x="355" y="538" text-anchor="middle" font-size="10" fill="#4b5563">Cloud Run · db-query-agent-sa</text>
    <text x="355" y="554" text-anchor="middle" font-size="10" fill="#4b5563">cloudsql:orders:read</text>
    <text x="355" y="572" text-anchor="middle" font-size="10" fill="#4b5563">text-to-SQL, sanitized</text>

    <rect x="450" y="498" width="150" height="88" rx="8" fill="#f0fdf4" stroke="#0f9d58" stroke-width="1.5"/>
    <text x="525" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">ReportAgent</text>
    <text x="525" y="538" text-anchor="middle" font-size="10" fill="#4b5563">Cloud Run · report-agent-sa</text>
    <text x="525" y="554" text-anchor="middle" font-size="10" fill="#4b5563">firestore:reports:write</text>
    <text x="525" y="572" text-anchor="middle" font-size="10" fill="#4b5563">executive brief synthesis</text>

    <rect x="620" y="498" width="150" height="88" rx="8" fill="#f0fdf4" stroke="#0f9d58" stroke-width="1.5"/>
    <text x="695" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">NotifierAgent</text>
    <text x="695" y="538" text-anchor="middle" font-size="10" fill="#4b5563">Cloud Run · notifier-agent-sa</text>
    <text x="695" y="554" text-anchor="middle" font-size="10" fill="#4b5563">slack / email:send</text>
    <text x="695" y="572" text-anchor="middle" font-size="10" fill="#4b5563">multi-channel dispatch</text>

    <rect x="790" y="498" width="150" height="88" rx="8" fill="#f0fdf4" stroke="#0f9d58" stroke-width="1.5"/>
    <text x="865" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">SecurityAuditor</text>
    <text x="865" y="538" text-anchor="middle" font-size="10" fill="#4b5563">Cloud Run · security-auditor-sa</text>
    <text x="865" y="554" text-anchor="middle" font-size="10" fill="#4b5563">provenance:chain:audit</text>
    <text x="865" y="572" text-anchor="middle" font-size="10" fill="#4b5563">HMAC signature verification</text>
  </g>

  <!-- arrows down to Gemini inference -->
  <line x1="355" y1="586" x2="450" y2="634" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="525" y1="586" x2="525" y2="634" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="695" y1="586" x2="695" y2="634" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="865" y1="586" x2="770" y2="634" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="310" y="636" width="620" height="46" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="620" y="664" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1f2937">Gemini 3.5 API — one scoped inference call per agent</text>

  <!-- signing bus: both Gemma triage and Firewall decisions feed provenance -->
  <line x1="670" y1="280" x2="960" y2="280" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2,4"/>
  <line x1="670" y1="385" x2="960" y2="385" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2,4"/>
  <line x1="960" y1="280" x2="960" y2="760" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2,4"/>
  <path d="M960,760 L690,760" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2,4" marker-end="url(#arrowAmber)"/>
  <text x="700" y="272" font-family="sans-serif" font-size="10" fill="#374151">HMAC-sign every</text>
  <text x="700" y="392" font-family="sans-serif" font-size="10" fill="#374151">attempt, allowed</text>
  <text x="700" y="412" font-family="sans-serif" font-size="10" fill="#374151">or blocked</text>

  <rect x="310" y="740" width="380" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="764" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937">Provenance Chain</text>
  <text x="500" y="782" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">Cloud Firestore / JSONL · append-only, tamper-evident</text>

  <!-- audit loop back to dashboard -->
  <path d="M310,770 C 40,772 40,60 378,55" fill="none" stroke="#4338ca" stroke-width="1.2" stroke-dasharray="2,4" marker-end="url(#arrow)"/>
  <text x="8" y="420" font-family="sans-serif" font-size="11" fill="#374151" transform="rotate(-90 8 420)">audit trail verify / poll</text>
</svg>
